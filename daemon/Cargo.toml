[package]
name = "mastodon-feedd"
version = "2.0.0"
edition = "2021"

[dependencies]
# Der eigentliche Grund fuer diese Fassung: rustls spricht TLS 1.2 selbst.
# Der Python-2-Dienst konnte das nicht (OpenSSL 0.9.8) und musste jede
# Anfrage an ein fremdes Python 3 weiterreichen; das faellt damit weg.
# Die Wurzelzertifikate kommen mitgeliefert (webpki-roots) -- der Vorrat des
# Geraets ist von 2011 und kennt die Aussteller von heute nicht.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots", "gzip"] }

# Die Ereignisansicht haengt am Sitzungsbus. zbus, nicht libdbus: reines
# Rust, damit das Binary statisch bleibt.
zbus = { version = "5", default-features = false, features = ["tokio"] }

# Ein Faden genuegt; auf einem Cortex-A8 kostet jeder weitere nur Stapel.
tokio = { version = "1", features = ["rt", "macros", "time", "fs", "io-util", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"          # Vorgabe-Map ist sortiert, wie Pythons sort_keys

# Nur fuer den Zeitstempel im Log.
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
