description "Mastodon feed trigger"
author "Sebastian"
start on EXT_APPS_STARTED
stop on stopping xsession
respawn
respawn limit 20 120

# Dieser Job startet den Dienst *nicht* selbst, er stoesst ihn nur an.
#
# Grund: ein Job unter /etc/init/apps laeuft als uid 0 -- aber mit einem leeren
# Rechtesatz, ohne eine einzige Nebengruppe und ohne Capability. Von dort
# scheitert jeder Kennungswechsel still (aegis-exec landet auf nobody, su
# meldet "can't set groups"), und weder nobody noch dieser root darf
# ~/.config/mastodon-feed/account.json lesen. Der Dienst hielt das Konto
# deshalb fuer nicht eingerichtet und schlief fuer immer.
#
# Nach /etc/init/xsession/, wo die Systemdienste als "user" laufen, kommt ein
# unsigniertes Paket nicht: Aegis verweigert dort jede Datei ohne Referenz-Hash
# ("verification failed (no reference hash)"), und Hashes bekommen nur
# signierte Pakete.
#
# Ein ueber den *Sitzungs*-D-Bus aktivierter Dienst dagegen laeuft als Besitzer
# des Busses, also als "user", mit HOME und Zugriff auf das Konto -- und dieses
# Verzeichnis (/usr/share/dbus-1/services) steht fremden Paketen offen.
# Der Bus wird aus dem nackten root erreicht, das ist erlaubt.
script
    # Auf die Sitzung warten; beim Hochfahren ist sie noch nicht da.
    n=0
    while [ ! -r /tmp/session_bus_address.user ] && [ $n -lt 60 ]; do
        sleep 2
        n=$((n + 1))
    done
    [ -r /tmp/session_bus_address.user ] || exit 0
    . /tmp/session_bus_address.user
    export DBUS_SESSION_BUS_ADDRESS

    # Anstossen, und danach nachsehen: stirbt der Dienst, wird er neu
    # aktiviert. Das ersetzt das respawn, das ein D-Bus-Dienst nicht hat.
    while true; do
        owner=$(dbus-send --session --print-reply --dest=org.freedesktop.DBus \
                    /org/freedesktop/DBus org.freedesktop.DBus.NameHasOwner \
                    string:org.smatkovi.MastodonFeed 2>/dev/null | tail -1)
        case "$owner" in
            *true*) ;;
            # Mit --print-reply, also wartend: ohne die Antwort kann der
            # Aufruf enden, bevor der Bus ihn bearbeitet hat.
            *) dbus-send --session --print-reply --reply-timeout=20000 \
                   --dest=org.freedesktop.DBus /org/freedesktop/DBus \
                   org.freedesktop.DBus.StartServiceByName \
                   string:org.smatkovi.MastodonFeed uint32:0 >/dev/null 2>&1 ;;
        esac
        sleep 300
    done
end script
