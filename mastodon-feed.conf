description "Mastodon feed updater"
author "Sebastian"
start on EXT_APPS_STARTED
stop on stopping xsession
respawn
respawn limit 20 120
# Dropped to uid "user". Not cosmetic: as root, Aegis refuses to exec
# /opt/wunderw/bin/python3 -- "Operation not permitted" -- and that
# interpreter is the only one on the device that can do TLS 1.2, so as root
# the daemon reaches no instance at all. The redirection is set up before
# the drop, so the log stays writable.
#
# Plain -u, no -s -l: with those two the command produces no output and
# returns at once, so Upstart sees the job exit the moment it starts.
exec /usr/bin/aegis-exec -u user /usr/bin/python /opt/mastodon-feed/feedd.py >> /var/log/mastodon-feed.log 2>&1
